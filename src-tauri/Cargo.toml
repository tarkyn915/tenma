[package]
name = "tenma"
version = "0.2.1"
description = "Tenma Player - a clean Navidrome music player"
authors = ["tarkyn915"]
license = "MIT"
repository = "https://github.com/tarkyn915/tenma-player"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "tenma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-http = "2.9.0"
tauri-plugin-dialog = "2"
walkdir = "2"
lofty = "0.22"
