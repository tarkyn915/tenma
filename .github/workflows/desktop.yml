name: Windows desktop build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: tenma-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build signed Tenma Player Windows app for releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --config src-tauri/tauri.release.conf.json

      - name: Build unsigned Tenma Player Windows app for main
        if: github.ref == 'refs/heads/main'
        run: npm run tauri:build

      - name: Create updater manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./scripts/create-updater-manifest.ps1 `
            -Version $version `
            -Repository '${{ github.repository }}' `
            -BundleDirectory 'src-tauri/target/release/bundle' `
            -OutputPath 'src-tauri/target/release/bundle/latest.json' `
            -Notes "Tenma Player $version update"

      - name: Upload installers as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tenma-player-windows-${{ github.ref_name }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Tenma Player ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Tenma Player for Windows

            This release was built by GitHub Actions and supports in-app updates.

            ### Downloads

            - `.exe`: NSIS installer for most Windows users
            - `.msi`: Windows Installer package

            After installation, future releases can be downloaded and installed directly from Tenma Player.
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/latest.json
