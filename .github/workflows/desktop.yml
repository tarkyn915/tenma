name: Windows desktop build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: tenma-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tenma Windows app
        run: npm run tauri:build

      - name: Upload installers as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tenma-windows-${{ github.ref_name }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Tenma ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## 天马 Tenma Windows 版本

            本版本由 GitHub Actions 自动构建。

            ### 下载

            - `.exe`：NSIS 安装程序，适合大多数 Windows 用户
            - `.msi`：Windows Installer 安装包

            ### 本次更新

            详细提交记录和变更说明由 GitHub 根据上一个版本自动生成。
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
